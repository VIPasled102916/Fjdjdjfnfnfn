<html lang="ko" data-theme="dark"><head>

<style>
:root{--bg:#150e19;--card:#211628;--line:#362640;--ink:#f6ecec;--mut:#b39aa9;--acc:#6fe3ee;--acc-t:#0f1f26;--acc-x:#6fe3ee;--ok:#67e8c0;--bad:#ff8fa3;--ai:#271b2f;--fs:16px;color-scheme:dark}
html[data-theme=light]{--bg:#fbf3f1;--card:#fff;--line:#eadbd8;--ink:#2a1830;--mut:#8a6f80;--ai:#fff;--bad:#d6335a;--acc-x:#0e8a9c;color-scheme:light}
@media(prefers-color-scheme:light){html[data-theme=auto]{--bg:#fbf3f1;--card:#fff;--line:#eadbd8;--ink:#2a1830;--mut:#8a6f80;--ai:#fff;--bad:#d6335a;--acc-x:#0e8a9c;color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
html{height:100%}
body{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;display:flex;flex-direction:column;color:var(--ink);font:var(--fs)/1.5 -apple-system,"Apple SD Gothic Neo",sans-serif;padding-top:env(safe-area-inset-top);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#150e19;z-index:60}
button{font:inherit;color:inherit}
#views{flex:1;position:relative;min-height:0}
.view{display:none;position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px}
.view.on{display:block}
#v-chat{padding:0}
#v-chat.on{display:flex;flex-direction:column}
.h{font-size:1.6em;margin:6px 4px 16px}
.card{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:16px}
.sec{color:var(--mut);font-size:.85em;margin:18px 6px 8px}
.note{color:var(--mut);font-size:.85em;margin:-6px 6px 16px}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer}
.row .lb{flex:1;min-width:0;word-break:break-word}
.row .v{color:var(--mut);text-align:right}
.row .chev{color:var(--mut)}
.row.bad .lb{color:var(--bad)}
.row.cur .lb{color:var(--acc-x);font-weight:700}
.mcard{display:flex;align-items:center;gap:14px;padding:18px}
.mcard.tap{cursor:pointer}
.mcard b{display:block;font-size:1.1em}
.mcard small{color:var(--mut)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 5px rgba(52,211,153,.2);flex:none}
.dot.off{background:var(--bad);box-shadow:0 0 0 5px rgba(248,113,113,.2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.grid button{background:var(--card);border:0;border-radius:16px;padding:18px 14px;text-align:left}
.grid small{display:block;color:var(--mut);margin-top:4px}
nav#tabs{display:flex;border-top:1px solid var(--line);background:var(--card);padding:0}
html.gapfix nav#tabs{background:#150e19}
nav#tabs button{flex:1;padding:8px 0 calc(8px + env(safe-area-inset-bottom));background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72em;color:var(--mut)}
nav#tabs button.on{color:var(--acc-x)}
html.gapfix nav#tabs button{padding:6px 0 var(--tabpad,10px)}
nav#tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar .ttl{flex:1;text-align:center;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:14px}
#log{flex:1;overflow-y:auto;padding:14px 8px;display:flex;flex-direction:column;gap:10px}
.m{max-width:94%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:var(--acc);color:var(--acc-t);border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:var(--ai);border:1px solid var(--line);border-bottom-left-radius:4px}
.empty{margin:auto;text-align:center;width:100%;padding:0 4px}
.chips{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;text-align:left}
.cpy{display:block;margin-top:6px;background:none;border:0;padding:0;font-size:12px;opacity:.55}
.typing{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.typing{animation:none}}
form#f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:var(--card);color:var(--ink);max-height:120px}
#s{border:0;border-radius:12px;background:var(--acc);color:var(--acc-t);padding:0 18px;font-weight:600}
#s:disabled{opacity:.5}
#bCode{border:1px solid var(--line);background:none;border-radius:12px;padding:0 12px}
#bCode.on{background:var(--acc);border-color:var(--acc);color:var(--acc-t)}
.code{margin:8px 0;border-radius:10px;overflow:hidden;background:#0d0812;color:#f1e9f2;white-space:normal}
.code .ch{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font-size:12px;opacity:.85}
.code .ch button{background:none;border:1px solid #5a4668;color:inherit;border-radius:6px;padding:2px 8px;font-size:12px}
.code pre{margin:0;padding:6px 10px 10px;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw:checked{background:var(--acc)}
.sw:checked::after{transform:translateX(20px)}
.seg{display:flex;gap:6px;flex:1}
.seg button{flex:1;padding:9px;border:1px solid var(--line);border-radius:10px;background:none}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-t)}
.bar2{flex:1.4;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--acc)}
input.tx{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--ink)}
.wide{width:100%;padding:12px;border-radius:12px;border:0;background:var(--acc);color:var(--acc-t);font-weight:600;margin-bottom:12px}
.probe{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top)}
.probe .ptop{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:.85em;min-height:44px}
.probe .ptop span{flex:1}
.prow{flex:1;display:flex;align-items:center;padding:0 16px;border-top:1px solid rgba(255,255,255,.2);background:rgba(111,227,238,.10);font-size:.85em}
.prow:nth-child(odd){background:rgba(255,143,163,.14)}
.prow.hit{background:#1f8f6b}
.page{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.ph{display:flex;align-items:center;padding:10px 8px}
.ph button{background:none;border:0;font-size:2em;line-height:1;padding:0 12px}
.ph b{flex:1;text-align:center;margin-right:44px}
.pb{flex:1;overflow-y:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
#login{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
#lf{display:flex;flex-direction:column;gap:10px;width:min(100%,320px)}
#lerr{color:var(--bad);min-height:1.4em;margin:0;text-align:center}
</style></head><body>
<div id="views">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-chat">
    <div class="bar"><button class="ib" id="bList" type="button">대화 목록</button><span class="ttl" id="ttl"></span><button class="ib" id="bNew" type="button">새 대화</button></div>
    <div id="log"></div>
    <form id="f"><button id="bCode" type="button">코딩</button><textarea id="t" rows="1" placeholder="메시지 입력"></textarea><button id="s">보내기</button></form>
  </section>

</div>
<nav id="tabs"></nav>
<div id="pages"></div>
<div id="login"><h2 style="margin:0" id="lname"></h2>
  <form id="lf"><input class="tx" id="pw" type="password" autocomplete="current-password" placeholder="비밀번호"><button class="wide" type="submit">로그인</button></form>
  <p id="lerr"></p></div>
<script>
// 폰 단독 모드용: 서버가 없을 때 /api/* 요청을 폰 안에서 흉내 낸다. (build_hosting.py가 index.html에 끼워 넣음)
(function(){
const J=(o,s=200)=>new Response(JSON.stringify(o),{status:s,headers:{"Content-Type":"application/json"}});
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function calc(t){
 const cand=t.replace(/[^\d.+\-*\/()%×÷^\s]/g,"").trim(),rest=t.replace(/[\d.+\-*\/()%×÷^\s]/g,"");
 if(!/\d/.test(cand)||!/[+\-*\/%×÷^]/.test(cand))return null;
 if(rest&&(rest.length>20||!/계산|얼마|결과|답|=|\?/.test(rest)))return null;
 const s=cand.replace(/\s+/g,"").replace(/×/g,"*").replace(/÷/g,"/");let i=0;
 function num(){const m=/^(\d+(\.\d+)?|\.\d+)/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])}
 function atom(){if(s[i]==="("){i++;const v=expr();if(s[i]!==")")throw 0;i++;return v}if(s[i]==="-"){i++;return -atom()}if(s[i]==="+"){i++;return atom()}return num()}
 function pow(){let b=atom();while(s[i]==="^"){i++;const e=atom();if(Math.abs(e)>100||Math.abs(b)>1e6)throw 0;b=Math.pow(b,e)}return b}
 function term(){let v=pow();while(i<s.length&&"*/%".includes(s[i])){const o=s[i++];const r=pow();v=o==="*"?v*r:o==="/"?v/r:v%r}return v}
 function expr(){let v=term();while(s[i]==="+"||s[i]==="-"){const o=s[i++];const r=term();v=o==="+"?v+r:v-r}return v}
 try{const v=expr();if(i!==s.length||!isFinite(v))return null;return "계산 결과: "+cand+" = "+(Math.round(v*1e10)/1e10)}catch(e){return null}}
function grams(s){s=s.replace(/\s+/g,"").toLowerCase();const g=new Set();for(let i=0;i<s.length-1;i++)g.add(s.slice(i,i+2));if(!g.size&&s)g.add(s);return g}
function related(q){const a=grams(q);return Math.min(3,ls.get("tg_mem",[]).filter(it=>{let n=0;grams(it.text).forEach(x=>{if(a.has(x))n++});return n>=2}).length)}
function addMem(text){const t=(text||"").trim().slice(0,500);if(!t)return null;const L=ls.get("tg_mem",[]);let it=L.find(x=>x.text===t);if(!it){it={id:String(Date.now()),text:t};L.push(it);ls.set("tg_mem",L.slice(-200))}return it}
function chat(msgs,mode,memOn){
 const last=(msgs[msgs.length-1]||{}).content||"";
 const m=/^\s*기억해\s*[:,]?\s*([\s\S]+)$/.exec(last);
 if(m){if(!memOn)return "기억 기능이 꺼져 있어요. 설정에서 켤 수 있어요.";const it=addMem(m[1]);return it?"기억해 둘게요: "+it.text:"기억할 내용이 비어 있어요."}
 const c=calc(last);if(c)return c;
 const coding=mode==="code"||/코드|코딩|함수|버그|파이썬|python|javascript/i.test(last);
 const n=memOn?related(last):0;
 let out="[임시 응답] 받은 메시지: "+last+(n?" (기억 "+n+"개 참고)":"");
 if(coding)out+="\n\n```python\n# 실제 모델이 연결되면 여기에 코드가 나와요\nprint(\"hello\")\n```";
 return out}
const realFetch=window.fetch.bind(window);
window.fetch=async(url,opt)=>{
 opt=opt||{};
 if(typeof url!=="string"||!url.startsWith("/api/"))return realFetch(url,opt);
 const m=(opt.method||"GET").toUpperCase();let body={};try{body=JSON.parse(opt.body||"{}")}catch(e){}
 await new Promise(r=>setTimeout(r,300));
 if(url==="/api/health")return J({ok:true,authed:true,mode:"phone",backend:"phone"});
 if(url==="/api/status")return J({mode:"phone",backend:"mock",trained:false,dataset:0});
 if(url==="/api/login"||url==="/api/logout")return J({ok:true});
 if(url==="/api/chat")return J({reply:chat(body.messages||[],body.mode,body.memory!==false)});
 if(url==="/api/memory"&&m==="GET")return J({items:ls.get("tg_mem",[])});
 if(url==="/api/memory"&&m==="POST"){const it=addMem(body.text);return it?J({item:it}):J({error:"내용이 비어 있어요"},400)}
 if(url.startsWith("/api/memory/")&&m==="DELETE"){const id=url.split("/").pop();ls.set("tg_mem",ls.get("tg_mem",[]).filter(x=>x.id!==id));return J({ok:true})}
 if(url==="/api/backup"&&m==="POST"){ls.set("tg_bk",{saved_at:Math.floor(Date.now()/1000),chats:body.chats||[]});return J({ok:true})}
 if(url==="/api/backup")return J(ls.get("tg_bk",{chats:null}));
 return J({error:"폰 단독 모드에서는 지원하지 않아요"},400)}
})();

</script>
<script>
const $=id=>document.getElementById(id);
const APP="AI";
const APP_VER="0.38";
const JH={"Content-Type":"application/json"};
const THEME={dark:"다크 모드",light:"라이트 모드",auto:"시스템 설정"};
const SEC="이 코드 보안 점검해줘\n```python\n\n```";
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
/* ---- 저장된 데이터 ---- */
let S={chats:[],cur:null},ST={theme:"dark",size:16,formal:true,direct:true,memory:true,autosave:true,code:false,gapfit:true,tabpad:10};
let MODE="server",STAT=null,tab="home";
try{const o=JSON.parse(localStorage.getItem("tg_v2")||"{}");if(Array.isArray(o.chats))S.chats=o.chats;S.cur=o.cur||null;if(o.size)ST.size=o.size;if(o.code)ST.code=true}catch(e){}
try{Object.assign(ST,JSON.parse(localStorage.getItem("tg_set")||"{}"))}catch(e){}
function save(){if(!ST.autosave)return;try{localStorage.setItem("tg_v2",JSON.stringify({chats:S.chats,cur:S.cur}))}catch(e){}}
function saveST(){try{localStorage.setItem("tg_set",JSON.stringify(ST))}catch(e){}}
function mk(){return{id:String(Date.now()),title:"새 대화",msgs:[]}}
function cur(){return S.chats.find(c=>c.id===S.cur)}
function newChat(){S.cur=null;save()}
function applyLook(){document.documentElement.dataset.theme=ST.theme;document.documentElement.style.setProperty("--tabpad",(ST.tabpad==null?10:ST.tabpad)+"px");document.documentElement.style.setProperty("--fs",ST.size+"px")}
function toneText(){return(ST.formal?"존댓말":"반말")+", "+(ST.direct?"직설적으로":"친절하게")}
function toneShort(){return(ST.formal?"존댓말":"반말")+" / "+(ST.direct?"직설적":"친절")}
function fmt(n){return n>=1e9?(n/1e9).toFixed(1)+"GB":n>=1e6?(n/1e6).toFixed(1)+"MB":Math.round(n/1e3)+"KB"}
/* ---- 서버 통신 ---- */
async function api(url,opt){const r=await fetch(url,opt);if(r.status===401){showLogin();throw new Error("로그인이 필요해요")}return r}
async function post(url,obj){const r=await api(url,{method:"POST",headers:JH,body:JSON.stringify(obj)});const j=await r.json();if(!r.ok)throw new Error(j.error||"서버 오류");return j}
async function loadStatus(){try{const r=await fetch("/api/status");if(r.status===401){showLogin();return}STAT=await r.json();MODE=STAT.mode||"server"}catch(e){STAT=null}refresh()}
function modelInfo(){
  if(!STAT)return{ok:false,title:"서버에 연결할 수 없어요",sub:"서버가 켜져 있는지 확인하세요",label:"-"};
  const names={mock:"임시 응답",ollama:"Ollama 모델",own:"자체 모델"};
  if(MODE==="phone")return{ok:true,title:"임시 응답 모드",sub:"폰 단독 · 서버 없음",label:"임시 응답 (폰 단독)"};
  const l=names[STAT.backend]||STAT.backend;
  return{ok:true,title:STAT.backend==="mock"?"임시 응답 모드":l+" 연결됨",sub:APP+" 서버 연결됨",label:l};
}
/* ---- 작은 부품 ---- */
function group(rs){const g=el("div","card");rs.forEach(r=>g.appendChild(r));return g}
function row(label,value,onclick,opt){opt=opt||{};const r=el("div","row"+(onclick?" tap":"")+(opt.danger?" bad":""));r.appendChild(el("span","lb",label));
  if(value!=null&&value!=="")r.appendChild(el("span","v",value));
  if(onclick){r.appendChild(el("span","chev","›"));r.onclick=onclick}return r}
function toggle(label,key,cb){const r=el("div","row");r.appendChild(el("span","lb",label));const i=document.createElement("input");i.type="checkbox";i.className="sw";i.checked=!!ST[key];
  i.onchange=()=>{ST[key]=i.checked;saveST();if(cb)cb()};r.appendChild(i);return r}
function seg(opts,curv,cb){const d=el("div","seg");opts.forEach(([v,l])=>{const b=el("button",v===curv?"on":"",l);b.type="button";
  b.onclick=()=>{cb(v);d.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on")};d.appendChild(b)});return d}
function segCard(opts,curv,cb){const c=el("div","card"),r=el("div","row");r.appendChild(seg(opts,curv,cb));c.appendChild(r);return c}
function meter(l,p,t){if(p==null)return row(l,"표시 안 됨");const r=el("div","row"),b=el("div","bar2"),i=el("i");i.style.width=Math.min(100,Math.max(0,p))+"%";b.appendChild(i);
  r.append(el("span","lb",l),b,el("span","v",t||Math.round(p)+"%"));return r}
/* ---- 화면 전환 ---- */
const ICON={home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',chat:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',feat:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>',set:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>'};
[["home","홈"],["chat","채팅"],["feat","기능"],["set","설정"]].forEach(([k,l])=>{const b=document.createElement("button");b.type="button";b.dataset.t=k;b.innerHTML=ICON[k]+"<span>"+l+"</span>";b.onclick=()=>{closeAllPages();go(k)};$("tabs").appendChild(b)});
function go(n){tab=n;["home","chat","feat","set"].forEach(k=>{$("v-"+k).classList.toggle("on",k===n);document.querySelector('#tabs [data-t="'+k+'"]').classList.toggle("on",k===n)});
  if(n==="chat"){render();syncCode()}else refresh()}
function refresh(){if(tab==="home")renderHome();else if(tab==="feat")renderFeat();else if(tab==="set")renderSet()}
function prefill(text){closeAllPages();S.cur=null;go("chat");$("t").value=text;grow();$("t").focus()}
const stack=[];
function openPage(title,build){const p=el("div","page"),h=el("div","ph"),b=el("button",null,"‹");b.type="button";b.onclick=closePage;h.append(b,el("b",null,title));
  const body=el("div","pb");p.append(h,body);$("pages").appendChild(p);stack.push({p,build,body});build(body)}
function closePage(){const s=stack.pop();if(s)s.p.remove();refresh()}
function closeAllPages(){while(stack.length)stack.pop().p.remove()}

function fill(d,text){d.textContent="";const re=/```([\w+-]*)[ \t]*\n?([\s\S]*?)```/g;let last=0,m;const add=s=>{if(s)d.appendChild(document.createTextNode(s))};
  while((m=re.exec(text))){add(text.slice(last,m.index));const w=el("div","code"),h=el("div","ch"),b=el("button",null,"복사");b.type="button";
    const code=m[2].replace(/\n$/,"");b.onclick=()=>copy(code,b);h.append(el("span",null,m[1]||"코드"),b);const pre=el("pre",null,code);w.append(h,pre);d.appendChild(w);last=re.lastIndex}
  add(text.slice(last))}
function copy(t,b){const done=()=>{b.textContent="복사됨";setTimeout(()=>b.textContent="복사",1200)};
  function fb(){const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();a.setSelectionRange(0,t.length);try{document.execCommand("copy");done()}catch(e){}a.remove()}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,fb)}else fb()}

$("f").onsubmit=async e=>{

  bubble("user",text);$("t").value="";grow();$("s").disabled=true;

const STANDALONE=navigator.standalone===true||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);

function needFit(){return STANDALONE&&innerHeight>innerWidth&&innerHeight<fullH()-20}

  return"화면 "+screen.width+"×"+screen.height+" · 영역 "+innerWidth+"×"+innerHeight+" · 뷰포트 "+(window.visualViewport?Math.round(visualViewport.height):"-")+" · 문서 "+document.documentElement.clientHeight+" · 안전영역 "+s+" · "+(STANDALONE?"앱":"브라우저")+" · 여백맞춤 "+(document.documentElement.classList.contains("gapfix")?"켜짐":"꺼짐")}

  const H=fullH(),p=el("div","probe");p.style.height=H+"px";
  const t=el("div","ptop"),x=el("button","ib","닫기");x.type="button";x.onclick=()=>p.remove();t.append(el("span",null,"줄을 눌러 보세요. 눌리면 초록색이 돼요. 맨 아래 줄까지 눌러 본 뒤 캡처해 주세요."),x);p.appendChild(t);
  const rows=[];for(let i=0;i<13;i++){const r=el("div","prow");r.onclick=()=>{r.classList.add("hit");r.dataset.hit="1";lab(r)};p.appendChild(r);rows.push(r)}
  function lab(r){const b=r.getBoundingClientRect();r.textContent="y "+Math.round(b.top)+"~"+Math.round(b.bottom)+(b.bottom>innerHeight+1?"  (영역 812 밖)":"")+(r.dataset.hit?"  눌림 ✓":"")}
  document.body.appendChild(p);requestAnimationFrame(()=>rows.forEach(lab))}
